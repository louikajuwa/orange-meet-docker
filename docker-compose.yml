services:
  orange-meet:
    build:
      context: .
      target: dev
    image: orange-meet:dev
    container_name: orange-meet
    restart: unless-stopped
    ports:
      - "4001:4000"
      - "127.0.0.1:35729:35729" # livereload (dev only)
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=4000
    volumes:
      - ./server.js:/app/server.js:ro
      - ./lib:/app/lib:ro
      - ./public:/app/public:ro
      - ./test:/app/test:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
